<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<head>

<title>Register</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

</head>

<body>

<div class="container mt-5">

<div class="row justify-content-center">

<div class="col-md-5">

<div class="card shadow">

<div class="card-header bg-success text-white">

<h3>Create Account</h3>

</div>

<div class="card-body">

<form
th:action="@{/register}"
method="post"
th:object="${user}">

<div class="mb-3">

<label>Name</label>

<input
class="form-control"
th:field="*{name}">

</div>

<div class="mb-3">

<label>Email</label>

<input
class="form-control"
th:field="*{email}">

</div>

<div class="mb-3">

<label>Password</label>

<input
type="password"
class="form-control"
th:field="*{password}">

</div>

<button
class="btn btn-success w-100">

Register

</button>

</form>

</div>

</div>

</div>

</div>

</div>

</body>

</html>
